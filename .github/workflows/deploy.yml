name: Deploy store

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_URL: https://rowfern.dezetingz.com
      PRODUCT_KEY: ${{ secrets.PRODUCT_KEY }}
      DODO_API_KEY: ${{ secrets.DODO_API_KEY }}
      DODO_MODE: ${{ vars.DODO_MODE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unseal products
        run: python3 scripts/unseal.py
      - name: Sync Dodo Payments checkout links
        run: python3 scripts/dodo_sync.py
      - name: Build site
        run: python3 scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify search engines
        run: python3 scripts/indexnow.py
